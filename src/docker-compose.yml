services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lealink
      POSTGRES_PASSWORD: lealink
      POSTGRES_DB: lealink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lealink"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://lealink:lealink@postgres:5432/lealink
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
